# Один workflow перевіряє той самий commit на трьох ОС і двох версіях Python.
name: Python CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      # Падіння на одній ОС не скасовує інші — так видно всі проблеми одразу.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Мінімальна підтримувана (requires-python) і актуальна версія.
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Однаковий синтаксис команд на всіх ОС (на Windows — Git Bash).
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest

      - name: Build wheel
        run: python -m build --wheel

      # Wheel встановлюється в окреме чисте середовище без dev-залежностей.
      - name: Install wheel into clean venv
        run: |
          python -m venv .venv-wheel
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv-wheel/Scripts/python; else PY=.venv-wheel/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --no-deps dist/*.whl

      - name: Run installed CLI (success)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          "$PY" -m kzp_lab06.cli --version
          "$PY" -m kzp_lab07.cli --version
          "$PY" -m kzp_lab06.cli data/input.csv reports/wheel-summary.txt
          "$PY" -m kzp_lab07.cli data/input.csv reports/wheel-summary-07.txt
          head -n 5 reports/wheel-summary-07.txt
          # Об'єктна модель (ЛР7) має давати той самий звіт, що й словникова (ЛР6).
          diff reports/wheel-summary.txt reports/wheel-summary-07.txt && echo "Звіти ЛР6 і ЛР7 однакові"
          "$PY" -m kzp_lab07.cli data/input.csv reports/details.txt --details > /dev/null
          tail -n 3 reports/details.txt

      # Пошкоджений CSV має дати ненульовий код (1) і повідомлення в stderr.
      - name: Run installed CLI (data error)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          printf 'name,form,price,days_left,prescription\nА,мазь,дорого,1,false\n' > broken.csv
          set +e
          "$PY" -m kzp_lab06.cli broken.csv reports/broken.txt
          code6=$?
          "$PY" -m kzp_lab07.cli broken.csv reports/broken.txt
          code7=$?
          set -e
          echo "exit codes: lab06=$code6 lab07=$code7"
          test "$code6" -eq 1 && test "$code7" -eq 1

      - name: Upload wheel
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
